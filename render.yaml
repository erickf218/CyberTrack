services:
  - type: web
    name: cybertrack-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # la configuras en el dashboard de Render
      - key: GROQ_API_KEY
        sync: false